name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel superseded in-progress runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv no longer publishes a moving major tag, so pin a full version.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # `uv run` (not `uvx`) so this syncs the project first: pre-commit runs
      # under the project's own .python-version interpreter with deps installed,
      # instead of uvx's isolated tool env (bare system Python, no project deps,
      # which breaks the ty hook and makes debug-statements choke on syntax the
      # runner's system Python predates). Also avoids pre-commit/action, which
      # still pins the Node 20 actions/cache@v4 internally.
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # installs uv, provisions Python from .python-version, and caches ~/.cache/uv
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen

      # Options (verbose, coverage, --block-network, fail-under) come from
      # pyproject.toml, so this matches a local `uv run pytest` exactly.
      - name: Run tests
        run: uv run pytest
