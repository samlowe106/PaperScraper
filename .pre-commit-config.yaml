default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        exclude: ^tests/cassettes/  # vcrpy recordings use python-specific tags
      - id: debug-statements
      - id: end-of-file-fixer
      - id: name-tests-test
        args: [--pytest-test-first]  # expect test_*.py (pytest convention)
        exclude: ^tests/utils\.py$  # shared helpers, not a test module
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: sort-simple-yaml
      - id: trailing-whitespace
        # preserve Markdown hard line breaks (a line ending in two spaces)
        args: [--markdown-linebreak-ext, "md,markdown"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        # Rules are configured in [tool.ruff.lint] in pyproject.toml (shared with
        # your editor). --fix makes commits auto-apply fixable violations.
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [--safe]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.3.0"
    hooks:
      - id: mypy
        # Settings live in [tool.mypy] in pyproject.toml (shared with your editor).
        # These two are CLI-only: they let the isolated hook env install stubs.
        args: [--install-types, --non-interactive]
